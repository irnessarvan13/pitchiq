# deploy.yml — GitHub Actions CI/CD pipeline
# runs on every pull request into main, and on every push to main
# test job: runs pytest (backend). frontend job: lint, type check, build and test the React app (with coverage).
# e2e job: starts the whole app in Docker and drives it with a real browser (Playwright).
# deploy job: SSHs into AWS, pulls latest code, rebuilds Docker containers
# deploy only runs after ALL test jobs pass, and only on pushes to main (never on pull requests)

name: Test and Deploy PitchIQ

# triggers — run on pushes to main and on pull requests into main
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest        # a fresh, empty Ubuntu computer from GitHub

    # service containers — Postgres and Redis running next to the tests (same images as docker-compose.yml)
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_DB: pitchiq_test       # the tests only ever use pitchiq_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres     # throwaway test database, deleted after every run
        ports:
          - 5433:5432                     # same port as my Mac (5433 outside → 5432 inside)
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379

    # environment variables for the steps — replaces the .env file, which isn't on GitHub
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/pitchiq_test
      FOOTBALL_API_KEY: fake-key-for-tests      # tests must never call the real API
      ANTHROPIC_API_KEY: fake-key-for-tests     # tests must never call the real Claude

    steps:
      # step 1 — copy the code onto the empty computer
      - name: Checkout code
        uses: actions/checkout@v5

      # step 2 — install Python 3.12 (same version as backend/Dockerfile)
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # step 3 — install the app's packages plus the test tools
      - name: Install packages
        run: pip install -r requirements-dev.txt

      # step 4 — run every test, and print which lines/branches no test ran
      - name: Run tests
        run: pytest -v --cov=backend --cov-branch --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest        # a second fresh computer — runs at the same time as the backend tests

    # every "run" step in this job happens inside the frontend/ folder (where package.json lives)
    defaults:
      run:
        working-directory: frontend

    steps:
      # step 1 — copy the code onto the empty computer
      - name: Checkout code
        uses: actions/checkout@v5

      # step 2 — install Node 24 (the test tools need Node 22.22+ or 24.15+)
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm                                        # remember downloaded packages between runs — faster installs
          cache-dependency-path: frontend/package-lock.json

      # step 3 — install EXACTLY the versions in package-lock.json (npm ci never changes the lock file)
      - name: Install packages
        run: npm ci

      # step 4 — lint: catch sloppy code (oxlint)
      - name: Lint
        run: npm run lint

      # step 5 — type check (tsc) and build the production version of the site
      - name: Type check and build
        run: npm run build

      # step 6 — run every frontend test, and print which lines/branches no test ran (#48)
      - name: Run tests with coverage
        run: npm run test:coverage

  e2e:
    runs-on: ubuntu-latest        # a third fresh computer — the whole app, end to end (#48)

    steps:
      # step 1 — copy the code onto the empty computer
      - name: Checkout code
        uses: actions/checkout@v5

      # step 2 — start every container: Postgres, Redis, FastAPI, React, and the FAKE football-data.org
      #          (docker-compose.e2e.yml gives the backend fake keys, so nothing can reach the real APIs)
      - name: Start the app in Docker
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build

      # step 3 — wait until the backend and the React app answer (they take a little while to start)
      - name: Wait for the app
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/ > /dev/null && curl -sf http://localhost:5173/ > /dev/null && exit 0
            sleep 2
          done
          echo "The app didn't start in 2 minutes"
          exit 1

      # step 4 — install Node and Playwright (with its Chromium browser)
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # step 5 — run the end-to-end test
      - name: Run the end-to-end test
        working-directory: e2e
        run: npx playwright test

      # if anything failed, print every container's logs so we can see why
      - name: Show the app's logs
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs

  deploy:
    needs: [test, frontend, e2e]               # wait for ALL test jobs, and skip deploy if any of them fails
    if: github.event_name == 'push'            # only deploy on pushes to main, never on pull requests
    runs-on: ubuntu-latest        # GitHub runs this on their own Ubuntu server

    steps:
      # step 1 — checkout the code
      - name: Checkout code
        uses: actions/checkout@v3

      # step 2 — SSH into AWS and deploy
      - name: Deploy to AWS
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.AWS_HOST }}        # your AWS IP — stored in GitHub Secrets
          username: ubuntu                      # AWS default username
          key: ${{ secrets.AWS_SSH_KEY }}      # your .pem key — stored in GitHub Secrets
          script: |
            cd ~/pitchiq
            git pull origin main
            docker-compose down
            docker-compose up --build -d
            echo "PitchIQ deployed successfully!"